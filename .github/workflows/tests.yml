name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      # This job deliberately has no secrets. The suite includes the integrity check
      # against the committed model-written briefing, so the deliverable is verified
      # here without a key ever being needed.
      - name: Run tests
        run: python -m pytest -q

      - name: Regenerate the briefing without a model
        run: python -m src.main --no-llm

      - name: Fail if the deterministic output is stale
        run: |
          git diff --exit-code output/facts_march-2026.json output/sop_briefing_march-2026_template.md \
            || (echo "Deterministic output is out of date — run 'python -m src.main --no-llm' and commit" && exit 1)
